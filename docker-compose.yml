services:
  postgres:
    image: postgres:17-alpine
    container_name: motomedic-db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-motomedic}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
